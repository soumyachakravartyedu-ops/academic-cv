name: Auto Update Publications

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-publications.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-publications
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public ORCID works
        run: |
          curl --fail --retry 3 -L \
            -H 'Accept: application/json' \
            'https://pub.orcid.org/v3.0/0000-0002-3579-9161/works' \
            -o /tmp/orcid-works.json

      - name: Update website publication section
        env:
          ORCID_ID: '0000-0002-3579-9161'
        run: |
          python - <<'PY'
          import html, json, re
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path('/tmp/orcid-works.json').read_text())
          works = []
          seen = set()

          for group in data.get('group', []):
              summaries = group.get('work-summary') or []
              if not summaries:
                  continue
              w = summaries[0]
              title = ((w.get('title') or {}).get('title') or {}).get('value') or 'Untitled work'
              year = (((w.get('publication-date') or {}).get('year') or {}).get('value')) or ''
              month = (((w.get('publication-date') or {}).get('month') or {}).get('value')) or '01'
              day = (((w.get('publication-date') or {}).get('day') or {}).get('value')) or '01'
              try:
                  date = datetime(int(year), int(month), int(day)) if year else datetime(1900,1,1)
              except Exception:
                  date = datetime(1900,1,1)

              journal = ((w.get('journal-title') or {}).get('value')) or ''
              doi = ''
              for ext in (w.get('external-ids') or {}).get('external-id', []):
                  if (ext.get('external-id-type') or '').lower() == 'doi':
                      doi = ext.get('external-id-value') or ''
                      break
              url = ((w.get('url') or {}).get('value')) or ''
              key = (doi.lower().strip() if doi else title.lower().strip())
              if key in seen:
                  continue
              seen.add(key)
              works.append({'title': title, 'year': year, 'date': date, 'journal': journal, 'doi': doi, 'url': url})

          works.sort(key=lambda x: x['date'], reverse=True)
          works = works[:10]

          cards = []
          for w in works:
              title = html.escape(w['title'])
              journal = html.escape(w['journal'])
              year = html.escape(str(w['year']))
              card = f'<div class="pub"><div class="pt">{title}</div><div class="pm">{journal}' + (f' · {year}' if year else '') + '</div>'
              if w['doi']:
                  doi = html.escape(w['doi'])
                  card += f'<a class="doi" href="https://doi.org/{doi}" target="_blank">DOI: {doi} ↗</a>'
              elif w['url']:
                  u = html.escape(w['url'], quote=True)
                  card += f'<a class="doi" href="{u}" target="_blank">View record ↗</a>'
              card += '</div>'
              cards.append(card)

          updated = datetime.now(timezone.utc).strftime('%d %B %Y, %H:%M UTC')
          section = (
              '<!-- AUTO-PUBLICATIONS-START -->'
              '<section class="sec" id="latest-publications"><div class="wrap">'
              '<h2>Latest Publications <span style="font-size:.7em;color:var(--muted);font-weight:500">(auto-updated)</span></h2>'
              f'<p style="color:var(--muted);font-size:.85rem">Automatically synchronized from the public ORCID record · Last checked {updated}</p>'
              '<div class="pubs">' + ''.join(cards) + '</div>'
              '<p style="color:var(--muted);font-size:.8rem;margin-top:14px">Source: ORCID · Updates automatically each day.</p>'
              '</div></section>'
              '<!-- AUTO-PUBLICATIONS-END -->'
          )

          p = Path('index.html')
          text = p.read_text()
          pattern = r'<!-- AUTO-PUBLICATIONS-START -->.*?<!-- AUTO-PUBLICATIONS-END -->'
          if re.search(pattern, text, flags=re.S):
              text = re.sub(pattern, section, text, flags=re.S)
          else:
              marker = '<section class="sec" id="publications">'
              if marker not in text:
                  raise SystemExit('Publications section marker not found')
              text = text.replace(marker, section + marker, 1)
          text = text.replace('<a href="#publications">Publications</a>', '<a href="#latest-publications">Latest Publications</a><a href="#publications">Publications</a>', 1)
          p.write_text(text)
          PY

      - name: Commit updated publications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No publication changes detected.'
          else
            git commit -m 'chore: sync latest publications from ORCID'
            git push
          fi
