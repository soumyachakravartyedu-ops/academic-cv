name: Auto Update Publications

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-publications.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-publications
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public ORCID works
        run: |
          curl --fail --retry 3 -L \
            -H 'Accept: application/json' \
            'https://pub.orcid.org/v3.0/0000-0002-3579-9161/works' \
            -o /tmp/orcid-works.json

      - name: Fetch OpenAlex author metrics
        run: |
          curl --fail --retry 3 -L \
            'https://api.openalex.org/authors/https://orcid.org/0000-0002-3579-9161' \
            -o /tmp/openalex-author.json || echo '{"cited_by_count":null,"summary_stats":{"h_index":null}}' > /tmp/openalex-author.json

      - name: Update publications and metrics
        run: |
          python - <<'PY'
          import html, json, re
          from datetime import datetime
          from pathlib import Path

          data = json.loads(Path('/tmp/orcid-works.json').read_text())
          all_works = []
          seen = set()

          for group in data.get('group', []):
              summaries = group.get('work-summary') or []
              if not summaries:
                  continue
              w = summaries[0]
              title = ((w.get('title') or {}).get('title') or {}).get('value') or 'Untitled work'
              pub = w.get('publication-date') or {}
              year = ((pub.get('year') or {}).get('value')) or ''
              month = ((pub.get('month') or {}).get('value')) or '01'
              day = ((pub.get('day') or {}).get('value')) or '01'
              try:
                  date = datetime(int(year), int(month), int(day)) if year else datetime(1900, 1, 1)
              except Exception:
                  date = datetime(1900, 1, 1)

              journal = ((w.get('journal-title') or {}).get('value')) or ''
              work_type = (w.get('type') or '').lower()
              doi = ''
              for ext in (w.get('external-ids') or {}).get('external-id', []):
                  if (ext.get('external-id-type') or '').lower() == 'doi':
                      doi = ext.get('external-id-value') or ''
                      break
              url = ((w.get('url') or {}).get('value')) or ''
              key = doi.lower().strip() if doi else title.lower().strip()
              if key in seen:
                  continue
              seen.add(key)
              all_works.append({'title': title, 'year': year, 'date': date, 'journal': journal, 'doi': doi, 'url': url, 'type': work_type})

          all_works.sort(key=lambda x: x['date'], reverse=True)
          works = all_works[:10]

          cards = []
          for w in works:
              title = html.escape(w['title'])
              journal = html.escape(w['journal'])
              year = html.escape(str(w['year']))
              card = f'<div class="pub"><div class="pt">{title}</div><div class="pm">{journal}'
              if year:
                  card += f' · {year}'
              card += '</div>'
              if w['doi']:
                  doi = html.escape(w['doi'])
                  card += f'<a class="doi" href="https://doi.org/{doi}" target="_blank">DOI: {doi} ↗</a>'
              elif w['url']:
                  u = html.escape(w['url'], quote=True)
                  card += f'<a class="doi" href="{u}" target="_blank">View record ↗</a>'
              card += '</div>'
              cards.append(card)

          # Metrics that can be reliably derived from the public ORCID record.
          total_works = len(all_works)
          book_chapters = sum(1 for w in all_works if w['type'] in ('book-chapter', 'book chapter', 'book-chapter'))

          # OpenAlex citation/h-index metrics, when available.
          try:
              oa = json.loads(Path('/tmp/openalex-author.json').read_text())
              citations = oa.get('cited_by_count')
              h_index = (oa.get('summary_stats') or {}).get('h_index')
          except Exception:
              citations = h_index = None

          p = Path('index.html')
          text = p.read_text()

          # Update metric cards by their visible labels without changing the surrounding design.
          replacements = {
              'Journal Articles': str(total_works),
              'Book Chapters': str(book_chapters),
          }
          if citations is not None:
              replacements['Citations'] = f'{citations}+'
          if h_index is not None:
              replacements['h-index'] = str(h_index)

          for label, value in replacements.items():
              pattern = r'<div class="metric"><b>[^<]*</b><span>' + re.escape(label) + r'</span></div>'
              text, n = re.subn(pattern, f'<div class="metric"><b>{html.escape(value)}</b><span>{label}</span></div>', text, count=1)
              if n == 0:
                  print(f'Warning: metric not found: {label}')

          updated = datetime.utcnow().strftime('%d %B %Y, %H:%M UTC')
          section = (
              '<!-- AUTO-PUBLICATIONS-START -->\n'
              '<section class="sec" id="publications">\n'
              '<div class="wrap">\n'
              '<h2>Publications <span style="font-size:.7em;color:var(--muted);font-weight:500">(auto-updated)</span></h2>\n'
              f'<p style="color:var(--muted);font-size:.85rem">Automatically synchronized from the public ORCID record · Last checked {updated}</p>\n'
              '<div class="pubs">' + ''.join(cards) + '</div>\n'
              '<p style="color:var(--muted);font-size:.8rem;margin-top:14px">Source: ORCID · Updates automatically each day.</p>\n'
              '</div>\n'
              '</section>\n'
              '<!-- AUTO-PUBLICATIONS-END -->'
          )

          start_marker = '<!-- AUTO-PUBLICATIONS-START -->'
          end_marker = '<!-- AUTO-PUBLICATIONS-END -->'
          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + section + text[end:]
          else:
              start_tag = '<section class="sec" id="publications">'
              start = text.find(start_tag)
              if start == -1:
                  raise SystemExit('Publications section not found')
              end = text.find('</section>', start)
              if end == -1:
                  raise SystemExit('Publications section closing tag not found')
              end += len('</section>')
              text = text[:start] + section + text[end:]

          # Remove any duplicate Publications sections left by the old workflow.
          while text.count('<section class="sec" id="publications">') > 1:
              first = text.find('<section class="sec" id="publications">')
              second = text.find('<section class="sec" id="publications">', first + 1)
              if second == -1:
                  break
              end = text.find('</section>', second)
              if end == -1:
                  raise SystemExit('Duplicate Publications section closing tag not found')
              end += len('</section>')
              text = text[:second] + text[end:]

          text = text.replace('<a href="#latest-publications">Latest Publications</a>', '')
          p.write_text(text)
          print(f'ORCID works: {total_works}; book chapters: {book_chapters}; citations: {citations}; h-index: {h_index}')
          PY

      - name: Commit updated website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No website changes detected.'
          else
            git commit -m 'chore: sync publications and metrics'
            git push
          fi
