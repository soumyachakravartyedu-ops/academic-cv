name: Repair site encoding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair website files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def clean(s):
              pairs = {
                  '\u00c2\u00b7': '\u00b7',
                  '\u00e2\u0080\u0093': '\u2013',
                  '\u00e2\u0080\u0094': '\u2014',
                  '\u00e2\u0080\u0098': '\u2018',
                  '\u00e2\u0080\u0099': '\u2019',
                  '\u00e2\u0080\u009c': '\u201c',
                  '\u00e2\u0080\u009d': '\u201d',
                  '\u00e2\u0080\u00a6': '\u2026',
                  '\u00e2\u0086\u0097': '\u2197',
                  '\u00c2\u00a0': ' ',
              }
              for _ in range(2):
                  old = s
                  for a, b in pairs.items():
                      s = s.replace(a, b)
                  if s == old:
                      break
              return s

          p = Path('index.html')
          s = clean(p.read_text(encoding='utf-8'))
          s = re.sub(r'(href="https://doi\\.org/[^" ]+?)(?:\\s*[\u2197\u2192\u2190])?"', r'\1"', s)
          s = re.sub(r'(<div class="metric"><b>)56\+(</b><span>Years Experience</span></div>)', r'\g<1>7+\g<2>', s)
          old_style = 'style="background-image: url(&quot;assets/hero-banner.png&quot;); background-size: cover; background-position: center center;"'
          new_style = 'style="background-image: url(&quot;assets/hero-banner.png?v=3&quot;); background-size: cover; background-position: center center;"'
          s = s.replace(old_style, new_style)
          p.write_text(s, encoding='utf-8')

          a = Path('admin.html')
          s = clean(a.read_text(encoding='utf-8'))
          s = s.replace(
              "html=atob(x.content.replace(/\\n/g,''));",
              "html=new TextDecoder('utf-8').decode(Uint8Array.from(atob(x.content.replace(/\\n/g,'')),c=>c.charCodeAt(0)));"
          )
          s = s.replace(
              "new Date(Math.min(...years)).getTime()",
              "new Date(Math.min(...years),0,1).getTime()"
          )
          s = s.replace(
              "h.style.backgroundImage=`url(\"${bp.replace(/\"/g,'&quot;')}\")`",
              "h.style.backgroundImage=`url(\"${bp.replace(/\"/g,'&quot;')}?v=${Date.now()}\")`"
          )
          a.write_text(s, encoding='utf-8')
          PY
      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet || (git commit -m 'fix: repair website encoding and admin decoder' && git push)
