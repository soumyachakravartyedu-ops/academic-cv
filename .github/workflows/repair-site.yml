name: Repair site encoding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Repair website files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def clean(s):
              pairs = {
                  '\u00c2\u00a9': '\u00a9',
                  '\u00c2\u00b7': '\u00b7',
                  '\u00e2\u0080\u0093': '\u2013',
                  '\u00e2\u0080\u0094': '\u2014',
                  '\u00e2\u0080\u0098': '\u2018',
                  '\u00e2\u0080\u0099': '\u2019',
                  '\u00e2\u0080\u009c': '\u201c',
                  '\u00e2\u0080\u009d': '\u201d',
                  '\u00e2\u0080\u00a6': '\u2026',
                  '\u00e2\u0086\u0097': '\u2197',
                  '\u00c2\u00a0': ' ',
              }
              for _ in range(3):
                  old = s
                  for a, b in pairs.items():
                      s = s.replace(a, b)
                  if s == old:
                      break
              return s

          def clean_dois(s):
              s = re.sub(r'(href="https://doi\.org/[^" ]+?)[\s]*(?:↗|→|←)*"', r'\1"', s)
              s = re.sub(r'(>DOI:\s*10\.[^<\s]+?)(?:\s*(?:↗|→|←))+\s*</a>', r'\1</a>', s)
              return s

          # Main site repairs and CV download button.
          p = Path('index.html')
          s = clean(p.read_text(encoding='utf-8'))
          s = clean_dois(s)
          s = re.sub(r'(<div class="metric"><b>)56\+(</b><span>Years Experience</span></div>)', r'\g<1>7+\g<2>', s)
          old_style = 'style="background-image: url(&quot;assets/hero-banner.png&quot;); background-size: cover; background-position: center center;"'
          new_style = 'style="background-image: url(&quot;assets/hero-banner.png?v=3&quot;); background-size: cover; background-position: center center;"'
          s = s.replace(old_style, new_style)
          s = s.replace('</style></head><body>', '.cv-download{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:9px 14px;border-radius:8px;background:var(--teal);color:#fff;font-size:.78rem;font-weight:800;text-decoration:none;box-shadow:0 3px 12px rgba(15,124,130,.18)}.cv-download:hover{background:var(--navy);color:#fff;text-decoration:none}</style></head><body>', 1)
          profile_anchor = '<div class="affiliation">Brainware University, Kolkata, India</div>'
          profile_button = profile_anchor + '<a class="cv-download" href="assets/Soumyabrata_Chakravarty_Academic_CV.pdf" download="Soumyabrata_Chakravarty_Academic_CV.pdf" target="_blank">Download CV (PDF)</a>'
          s = s.replace(profile_anchor, profile_button, 1)
          p.write_text(s, encoding='utf-8')

          # Admin: add CV PDF upload/replace control and wire it into Save & Publish.
          a = Path('admin.html')
          s = clean(a.read_text(encoding='utf-8'))
          s = s.replace(
              '<div class="field full"><label>Current banner path</label><input id="bannerPath" placeholder="assets/hero-banner.png"></div>',
              '<div class="field full"><label>Current banner path</label><input id="bannerPath" placeholder="assets/hero-banner.png"></div><div class="field full"><label>CV PDF</label><input id="cvFile" type="file" accept="application/pdf"><div class="small">Upload or replace the professional CV PDF used by the Download CV button.</div><div class="row"><input id="cvPath" value="assets/Soumyabrata_Chakravarty_Academic_CV.pdf" placeholder="assets/Soumyabrata_Chakravarty_Academic_CV.pdf"><a id="cvPreview" class="btn secondary" href="assets/Soumyabrata_Chakravarty_Academic_CV.pdf" target="_blank" style="display:none">Open current CV</a></div></div>',
              1
          )
          s = s.replace(
              "let hero=doc.querySelector('.hero');setVal('bannerPath',hero?.getAttribute('data-banner')||'');",
              "let hero=doc.querySelector('.hero');setVal('bannerPath',hero?.getAttribute('data-banner')||'');let cv=doc.querySelector('a.cv-download');setVal('cvPath',cv?.getAttribute('href')||'assets/Soumyabrata_Chakravarty_Academic_CV.pdf');if(cv){$('cvPreview').href=cv.getAttribute('href');$('cvPreview').style.display='inline-flex'}",
              1
          )
          s = s.replace(
              "async function saveSite(){try{",
              "async function saveSite(){try{const cvFile=$('cvFile').files[0];let cvPath=$('cvPath').value.trim()||'assets/Soumyabrata_Chakravarty_Academic_CV.pdf';if(cvFile){if(!cvFile.name.toLowerCase().endsWith('.pdf'))throw Error('CV must be a PDF file.');saveStatus('Uploading CV PDF…');await uploadImage(cvFile,cvPath)}",
              1
          )
          a.write_text(s, encoding='utf-8')
          PY
      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet || (git commit -m 'feat: add CV PDF download and admin upload' && git push)
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload repaired site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy repaired site
        id: deployment
        uses: actions/deploy-pages@v4
