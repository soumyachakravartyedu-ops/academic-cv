name: Repair site encoding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair UTF-8 and admin decoder
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          fixes={'Â·':'·','â':'–','â':'—','â':'‘','â':'’','â':'“','â':'”','â¦':'…','â':'↗'}
          for a,b in fixes.items(): s=s.replace(a,b)
          s=re.sub(r'(href="https://doi\.org/[^" ]+) [↗]"',r'\1"',s)
          s=re.sub(r'<div class="metric"><b>56\+</b><span>Years Experience</span></div>', '<div class="metric"><b>7+</b><span>Years Experience</span></div>', s)
          p.write_text(s,encoding='utf-8')
          a=Path('admin.html')
          s=a.read_text(encoding='utf-8')
          s=s.replace("html=atob(x.content.replace(/\\n/g,''));", "html=new TextDecoder('utf-8').decode(Uint8Array.from(atob(x.content.replace(/\\n/g,'')),c=>c.charCodeAt(0)));" )
          s=s.replace("new Date(Math.min(...years)).getTime()", "new Date(Math.min(...years),0,1).getTime()")
          a.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet || (git commit -m 'fix: repair UTF-8 and admin publishing' && git push)
