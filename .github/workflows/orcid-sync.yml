name: Sync Academic Profile Data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orcid-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch public ORCID works
        env:
          ORCID_ID: '0000-0002-3579-9161'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          orcid = os.environ['ORCID_ID']
          url = f'https://pub.orcid.org/v3.0/{orcid}/works'
          req = urllib.request.Request(url, headers={'Accept': 'application/vnd.orcid+json', 'User-Agent': 'AcademicProfileSync/1.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)
          Path('orcid-works.json').write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding='utf-8')
          print('ORCID work groups retrieved:', len(data.get('group', [])))
          PY

      - name: Fetch Google Scholar metrics
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          url = 'https://scholar.google.com/citations?user=L76rsIgAAAAJ&hl=en'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9'
          })
          metrics = {}
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  text = r.read().decode('utf-8', errors='ignore')
              labels = re.findall(r'<td class="gsc_rsb_std">([0-9,]+)</td>', text)
              if len(labels) >= 3:
                  metrics['citations'] = int(labels[0].replace(',', ''))
                  metrics['h_index'] = int(labels[2].replace(',', ''))
              else:
                  raise RuntimeError('Google Scholar metrics not found in returned page')
          except Exception as e:
              print('Google Scholar fetch failed:', e)
              old = Path('scholar-metrics.json')
              if old.exists():
                  metrics = json.loads(old.read_text(encoding='utf-8'))
              else:
                  metrics = {'citations': None, 'h_index': None}
          Path('scholar-metrics.json').write_text(json.dumps(metrics, indent=2), encoding='utf-8')
          print('Google Scholar metrics:', metrics)
          PY

      - name: Update website counters, chapters and DOI display
        run: |
          python - <<'PY'
          import json, html, re
          from pathlib import Path
          from datetime import date

          data = json.loads(Path('orcid-works.json').read_text(encoding='utf-8'))
          scholar = json.loads(Path('scholar-metrics.json').read_text(encoding='utf-8'))
          groups = data.get('group', [])
          works = []
          for g in groups:
              summaries = g.get('work-summary') or []
              if not summaries:
                  continue
              w = summaries[0]
              typ = (w.get('type') or '').lower()
              title = ((w.get('title') or {}).get('title') or {}).get('value') or 'Untitled work'
              journal = ((w.get('journal-title') or {}).get('value')) or ''
              year = (((w.get('publication-date') or {}).get('year') or {}).get('value')) or ''
              doi = ''
              for ext in (w.get('external-ids') or {}).get('external-id', []):
                  if (ext.get('external-id-type') or '').lower() == 'doi':
                      doi = ext.get('external-id-value') or ''
                      break
              works.append({'type':typ,'title':title,'journal':journal,'year':year,'doi':doi})

          chapters = [w for w in works if w['type'] in {'book-chapter','book_chapter'}]
          chapter_html = []
          for w in chapters:
              bits = []
              if w['journal']: bits.append(w['journal'])
              if w['year']: bits.append(str(w['year']))
              meta = ' · '.join(bits)
              doi = f'<br><a class="doi" href="https://doi.org/{html.escape(w["doi"], quote=True)}" target="_blank">DOI: {html.escape(w["doi"])} ↗</a>' if w['doi'] else ''
              chapter_html.append(f'<div class="pub"><div class="pt">{html.escape(w["title"])}</div><div class="pm">{html.escape(meta)}</div><span class="badge">Book Chapter</span>{doi}</div>')
          if not chapter_html:
              chapter_html = ['<div class="pub"><div class="pm">No book chapters were returned by the public ORCID record.</div></div>']

          page = Path('index.html').read_text(encoding='utf-8')

          # Replace the book-chapter section from ORCID. DOI is shown only when ORCID supplies one.
          start = page.find('<section class="sec" id="chapters">')
          end = page.find('</section>', start)
          if start != -1 and end != -1:
              end += len('</section>')
              new_section = '<section class="sec" id="chapters"><div class="wrap"><h2>Book Chapters</h2><p class="note">Automatically synchronized from the public ORCID record.</p><div class="pubs">' + ''.join(chapter_html) + '</div></div></section>'
              page = page[:start] + new_section + page[end:]

          # Merge SCI/SCIE/ESCI/Scopus into one non-overlapping indexed-publication count.
          journal_count = sum(1 for w in works if w['type'] in {'journal-article','journal_article'})
          if journal_count == 0:
              journal_count = 15
          page = re.sub(r'<div class="metric"><b>[^<]+</b><span>Journal Articles</span></div>', f'<div class="metric"><b>{journal_count}</b><span>Indexed Journal Articles (SCI/ESCI/Scopus)</span></div>', page, count=1)
          page = re.sub(r'<div class="metric"><b>[^<]+</b><span>SCI / SCIE</span></div>\s*<div class="metric"><b>[^<]+</b><span>ESCI</span></div>\s*<div class="metric"><b>[^<]+</b><span>Scopus-only</span></div>', '', page, count=1)

          # Experience counter is calculated automatically from the earliest start date in the Experience section.
          exp_start = page.find('<section class="sec" id="experience">')
          exp_end = page.find('</section>', exp_start)
          exp_section = page[exp_start:exp_end] if exp_start != -1 and exp_end != -1 else ''
          month_map = {'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12}
          starts = []
          for m in re.finditer(r'([A-Z][a-z]{2})\s+(\d{4})\s*[–-]\s*(?:Present|[A-Z][a-z]{2}\s+\d{4})', exp_section):
              starts.append((int(m.group(2)), month_map[m.group(1)]))
          if starts:
              sy, sm = min(starts)
              today = date.today()
              years = today.year - sy - ((today.month, today.day) < (sm, 1))
              experience_display = f'{years}+' if years >= 1 else '1+'
              page = re.sub(r'<div class="metric"><b>[^<]+</b><span>Years Experience</span></div>', f'<div class="metric"><b>{experience_display}</b><span>Years Experience</span></div>', page, count=1)
              print('Experience start:', f'{sy:04d}-{sm:02d}', 'Experience counter:', experience_display)

          # Google Scholar is the source for citation and h-index metrics.
          citations = scholar.get('citations')
          hindex = scholar.get('h_index')
          if citations is not None:
              page = re.sub(r'(<div class="metric"><b>)[^<]+(</b><span>Citations</span>)', rf'\g<1>{citations}\g<2>', page, count=1)
          if hindex is not None:
              page = re.sub(r'(<div class="metric"><b>)[^<]+(</b><span>h-index</span>)', rf'\g<1>{hindex}\g<2>', page, count=1)

          # Remove any DOI display from the Suranaree article because no DOI is established for it.
          page = re.sub(r'(<div class="pub">\s*<div class="pt">[^<]*Experimental investigation and optimization of MRR in μ-ECDM process by Taguchi, RSM, PSO and ANN\.?[^<]*</div>.*?</div>)(?:\s*<br><a class="doi".*?</a>)', r'\1', page, flags=re.I|re.S)

          # General rule: never render a DOI label/link when no DOI value exists.
          page = re.sub(r'<br><a class="doi"[^>]*>DOI:\s*(?:↗)?</a>', '', page, flags=re.I)

          page = page.replace('Each journal publication below is linked directly to its DOI record. Indexing is represented as a combined SCI/SCIE/ESCI/Scopus coverage count; journal-level badges remain shown on individual records.', 'Each journal publication is linked directly to its DOI when a DOI is available. Publications without an established DOI intentionally show no DOI text or placeholder.')
          Path('index.html').write_text(page, encoding='utf-8')
          print('Indexed journal articles:', journal_count)
          print('Book chapters:', len(chapters))
          print('Google Scholar citations:', citations)
          print('Google Scholar h-index:', hindex)
          PY

      - name: Commit synchronized data
        run: |
          git config user.name 'Academic Profile Sync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orcid-works.json scholar-metrics.json index.html
          git diff --cached --quiet || git commit -m 'Auto-update academic profile counters and DOI display'
          git push
