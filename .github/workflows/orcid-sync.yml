name: Sync ORCID Publications

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync public ORCID record
        env:
          ORCID_ID: '0000-0002-3579-9161'
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          orcid = os.environ['ORCID_ID']
          url = f'https://pub.orcid.org/v3.0/{orcid}/works'
          req = urllib.request.Request(url, headers={'Accept': 'application/vnd.orcid+json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          Path('orcid-works.json').write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding='utf-8')
          print('ORCID works retrieved:', len(data.get('group', [])))
          PY

      - name: Commit ORCID data if changed
        run: |
          git config user.name 'ORCID Sync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orcid-works.json
          git diff --cached --quiet || git commit -m 'Sync publication data from ORCID'
          git push
