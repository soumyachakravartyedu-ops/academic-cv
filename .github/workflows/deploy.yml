name: Deploy academic profile to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair encoding and site assets before deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          fixes = {
              'Â·':'·', 'â':'–', 'â':'—', 'â':'‘', 'â':'’',
              'â':'“', 'â':'”', 'â¦':'…', 'â':'↗', 'Â ':' ',
              'â€™':'’', 'â€œ':'“', 'â€':'”', 'â€“':'–', 'â€”':'—',
              'â€¦':'…', 'â†’':'→', 'â†':'←'
          }

          def clean(s):
              for _ in range(2):
                  old = s
                  for a,b in fixes.items():
                      s = s.replace(a,b)
                  if s == old:
                      break
              return s

          p = Path('index.html')
          s = clean(p.read_text(encoding='utf-8'))
          s = re.sub(r'(href="https://doi\.org/[^" ]+?)(?:\s*(?:↗|→|←))?"', r'\1"', s)
          s = re.sub(r'(<div class="metric"><b>)56\+(</b><span>Years Experience</span></div>)', r'\g<1>7+\g<2>', s)
          s = re.sub(r'style="background-image:\s*url\((?:&quot;|\")assets/hero-banner\.png(?:\?v=\d+)?(?:&quot;|\")\);?[^\"]*"', 'style="background-image: url(&quot;assets/hero-banner.png?v=3&quot;); background-size: cover; background-position: center center;"', s)
          p.write_text(s, encoding='utf-8')

          a = Path('admin.html')
          s = clean(a.read_text(encoding='utf-8'))
          s = s.replace(
              "html=atob(x.content.replace(/\\n/g,''));",
              "html=new TextDecoder('utf-8').decode(Uint8Array.from(atob(x.content.replace(/\\n/g,'')),c=>c.charCodeAt(0)));"
          )
          s = s.replace(
              "new Date(Math.min(...years)).getTime()",
              "new Date(Math.min(...years),0,1).getTime()"
          )
          s = s.replace(
              "h.style.backgroundImage=`url(\"${bp.replace(/\"/g,'&quot;')}\")`",
              "h.style.backgroundImage=`url(\"${bp.replace(/\"/g,'&quot;')}?v=${Date.now()}\")`"
          )
          a.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
